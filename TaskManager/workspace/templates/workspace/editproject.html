<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wk details</title>
    <style>
        .container {
            display: flex;
        }

        .box {
            width: 50%;
        }
    </style>
</head>

<body>


    <div class="container">
        <div class="box">

            <form method="post">
                {% csrf_token %}
                {{form}}
                <button type="submit">edit</button>
            </form>

        </div>
        <div class="box">
            {% if project.create_by == request.user or role == "OW"%}
            <form action="{% url 'workspace:removeproject' project.id %}" method="post">
                {%csrf_token%}
                <button type="submit"> remove project</button>
            </form>
            {%endif%}
        </div>

</body>

</html>
